name: Release

# Tags and releases a given ref from Actions (Claude Code cloud sessions can't
# push tags or create releases themselves). The run builds the jar from the ref
# and attaches it to the release; the Pack consumes it from there.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create, e.g. v0.1.0
        required: true
      ref:
        description: Branch, tag or commit SHA to release
        required: true
        default: main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check version is new
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v1.2.3"; exit 1; }
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "::error::$VERSION already exists"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -Pmod_version="${VERSION#v}"

      - name: Tag and release
        run: |
          gh release create "$VERSION" build/libs/*.jar \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --notes "Built from ${{ inputs.ref }} ($(git rev-parse --short HEAD))."
